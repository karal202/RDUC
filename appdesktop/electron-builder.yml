appId: com.dawa.optimizer
productName: Dawa Optimizer
asar: true
directories:
  buildResources: build
  output: release
files:
  - 'out/**/*'
  - 'package.json'
  - 'node_modules/**/*'
  - 'resources/**/*'
  - '!resources/scripts/**/*.reg'
  - '!resources/scripts/**/*.bat'
  - '!resources/scripts/**/*.ps1'
  - '!resources/scripts/**/*.cmd'
  - '!**/*.map'
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
extraResources:
  - from: 'resources/scripts'
    to: 'scripts'
    filter:
      - '**/*.dat'
      - '**/*.exe'
      - '**/*.txt'
      - '**/*.pdf'
      - '**/*.md'
      - '**/*.png'
      - '**/*.jpg'
      - '**/*.jpeg'
win:
  icon: build/icon.ico
  target:
    - nsis
  executableName: Dawa-Optimizer
  requestedExecutionLevel: asInvoker
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  include: build/installer.nsh
  warningsAsErrors: false
  allowElevation: true
  perMachine: false
  unicode: true
  differentialPackage: false
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  # Enable native NSIS /LOG flag → installer also writes its native log to INSTDIR next to exe (failsafe even if custom log fails)
  runAfterFinish: true
  deleteAppDataOnUninstall: false
publish:
  - provider: github
    owner: karal202
    repo: RDUC
    releaseType: release
  - provider: generic
    url: https://rduc.onrender.com/updates
    channel: latest
