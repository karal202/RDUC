appId: com.dawa.optimizer
productName: DAWA System Check
directories:
  buildResources: build
  output: release
files:
  - "out/**/*"
  - "package.json"
  - "node_modules/**/*"
  - "resources/**/*"
  - "!**/*.map"
  - "!**/.vscode/*"
  - "!src/*"
  - "!electron.vite.config.{js,ts,mjs,cjs}"
asar: true
win:
  target:
    - nsis
  executableName: dawa-system-check
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
publish:
  provider: generic
  url: https://rduc.onrender.com/updates
  channel: latest
