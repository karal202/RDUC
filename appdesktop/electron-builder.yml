appId: com.dawa.optimizer
productName: Dawa Optimizer
asar: true
directories:
  buildResources: build
  output: release
files:
  - "out/**/*"
  - "package.json"
  - "node_modules/**/*"
  - "resources/**/*"
  - "!**/*.map"
  - "!**/.vscode/*"
  - "!src/*"
  - "!electron.vite.config.{js,ts,mjs,cjs}"
win:
  icon: build/icon.ico
  target:
    - nsis
  executableName: Dawa-Optimizer
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
publish:
  - provider: github
    owner: karal202
    repo: RDUC
    releaseType: release
  - provider: generic
    url: https://rduc.onrender.com/updates
    channel: latest
