appId: com.dawa.optimizer
productName: Dawa Optimizer
asar: true
asarUnpack:
  - '**/node_modules/**/*.node'
  - '**/node_modules/**/*.dll'
  - '**/node_modules/**/*.exe'
  - '**/node_modules/**/*.ps1'
  - '**/node_modules/**/*.bat'
  - '**/*.node'
  - '**/*.dll'
  - '**/scripts/**/*.exe'
  - '**/scripts/**/*.dll'
  - '**/scripts/**/*.ps1'
  - '**/scripts/**/*.bat'
  - '**/scripts/Tool&cache/**/*'
  - '**/scripts/Tool&cache/**/*.exe'
  - '**/resources/**/*.ps1'
  - '**/*.node'
  - '**/*.dll'
  - '**/scripts/**/*.exe'
  - '**/scripts/**/*.dll'
  - '**/scripts/**/*.ps1'
  - '**/scripts/**/*.bat'
  - '**/scripts/Tool&cache/**/*'
  - '**/scripts/Tool&cache/**/*.exe'
  - '**/resources/**/*.ps1'
  - '**/scripts-enc/**/*.dat'
compression: maximum
generateUpdatesFilesForAllChannels: true
artifactName: ${productName}-Setup-${version}-${arch}.${ext}
directories:
  buildResources: build
  output: release
files:
  - 'out/**/*'
  - 'package.json'
  - 'node_modules/**/*'
  - 'resources/**/*'
  - '!resources/scripts/**/*'
  - '!**/*.map'
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
extraResources:
  - from: 'resources/scripts'
    to: 'scripts'
    filter:
      - '**/*.exe'
      - '**/*.dll'
      - '**/*.msi'
      - '**/*.zip'
      - '**/*.lnk'
      - '**/*.url'
      - '**/*.mp4'
      - '**/*.png'
      - '**/*.jpg'
      - '**/*.jpeg'
      - '**/*.pdb'
      - '**/*.config'
  - from: 'build/encrypted-scripts'
    to: 'scripts-enc'
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
  executableName: Dawa-Optimizer
  requestedExecutionLevel: requireAdministrator
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: false
  allowElevation: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  perMachine: false
  differentialPackage: true
  include: build/installer.nsh
  license: build/license_en.txt
  deleteAppDataOnUninstall: false
  runAfterFinish: true
  warningsAsErrors: false
publish:
  - provider: github
    owner: karal202
    repo: RDUC
    releaseType: release
  - provider: generic
    url: https://rduc.onrender.com/updates
    channel: latest
