appId: com.dawa.optimizer
productName: Dawa Optimizer
asar: true
asarUnpack:
  - '**/node_modules/**/*.node'
  - '**/node_modules/**/*.dll'
  - '**/node_modules/**/*.exe'
  - '**/node_modules/**/*.ps1'
  - '**/node_modules/**/*.bat'
compression: maximum
generateUpdatesFilesForAllChannels: true
artifactName: ${productName}-Setup-${version}-${arch}.${ext}
directories:
  buildResources: build
  output: release
files:
  - 'out/**/*'
  - 'package.json'
  - 'node_modules/**/*'
  - 'resources/**/*'
  - '!resources/scripts/**/*'
  - '!**/*.map'
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
extraResources:
  - from: 'resources/scripts'
    to: 'scripts'
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
  executableName: Dawa-Optimizer
  requestedExecutionLevel: requireAdministrator
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: false
  createDesktopShortcut: always
  createStartMenuShortcut: true
  perMachine: false
  differentialPackage: true
  include: build/installer.nsh
  deleteAppDataOnUninstall: false
  runAfterFinish: true
  warningsAsErrors: false
publish:
  - provider: github
    owner: karal202
    repo: RDUC
    releaseType: release
  - provider: generic
    url: https://rduc.onrender.com/updates
    channel: latest
