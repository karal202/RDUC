<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PC Info Demo</title>
    <style>
      :root {
        --bg: #0b1020;
        --panel: #121a2d;
        --panel-alt: #1a2540;
        --text: #e5ecff;
        --muted: #9db2d9;
        --accent: #66d9ef;
        --good: #7ee787;
        --warn: #f7c948;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        background: linear-gradient(135deg, #0b1020, #101827);
        color: var(--text);
        font-family: Arial, Helvetica, sans-serif;
      }

      .container {
        max-width: 1100px;
        margin: 0 auto;
        padding: 32px 20px 48px;
      }

      h1 {
        margin-bottom: 8px;
        font-size: 2rem;
      }

      .subtitle {
        color: var(--muted);
        margin-bottom: 24px;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 20px;
      }

      .card {
        background: rgba(18, 26, 45, 0.95);
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 16px;
        padding: 18px 18px 14px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
      }

      .card h2 {
        margin: 0 0 12px;
        font-size: 1.1rem;
        color: var(--accent);
      }

      .stat-list {
        list-style: none;
        padding: 0;
        margin: 0;
      }

      .stat-list li {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        padding: 8px 0;
        border-bottom: 1px solid rgba(255,255,255,0.06);
        color: var(--text);
      }

      .stat-list li:last-child {
        border-bottom: none;
      }

      .label {
        color: var(--muted);
      }

      .value {
        text-align: right;
        word-break: break-word;
      }

      .status {
        display: inline-block;
        padding: 8px 12px;
        border-radius: 999px;
        background: rgba(126, 231, 135, 0.12);
        color: var(--good);
        border: 1px solid rgba(126, 231, 135, 0.3);
        margin-bottom: 18px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Thông tin máy tính</h1>
      <div class="subtitle">Hiển thị thông số từ chính máy tính đang chạy ứng dụng</div>
      <div class="status" id="status">Đang tải...</div>

      <div class="grid">
        <section class="card">
          <h2>Hệ thống</h2>
          <ul class="stat-list" id="system-list"></ul>
        </section>

        <section class="card">
          <h2>CPU</h2>
          <ul class="stat-list" id="cpu-list"></ul>
        </section>

        <section class="card">
          <h2>RAM</h2>
          <ul class="stat-list" id="memory-list"></ul>
        </section>

        <section class="card">
          <h2>Ổ cứng</h2>
          <ul class="stat-list" id="disk-list"></ul>
        </section>

        <section class="card">
          <h2>Mạng</h2>
          <ul class="stat-list" id="network-list"></ul>
        </section>

        <section class="card">
          <h2>Pin</h2>
          <ul class="stat-list" id="battery-list"></ul>
        </section>
      </div>
    </div>

    <script>
      function formatBytes(bytes) {
        if (bytes === undefined || bytes === null || Number.isNaN(bytes)) return 'N/A';
        const units = ['B', 'KB', 'MB', 'GB', 'TB'];
        let value = bytes;
        let unitIndex = 0;

        while (value >= 1024 && unitIndex < units.length - 1) {
          value /= 1024;
          unitIndex += 1;
        }

        return `${value.toFixed(2)} ${units[unitIndex]}`;
      }

      function setRows(targetId, data) {
        const target = document.getElementById(targetId);
        target.innerHTML = '';

        Object.entries(data).forEach(([label, value]) => {
          const row = document.createElement('li');
          row.innerHTML = `
            <span class="label">${label}</span>
            <span class="value">${value}</span>
          `;
          target.appendChild(row);
        });
      }

      async function loadInfo() {
        try {
          const data = await window.pcInfoApi.getSystemInfo();

          setRows('system-list', {
            'Platform': data.system.platform,
            'Distro': data.system.distro,
            'Release': data.system.release,
            'Hostname': data.system.hostname,
            'Arch': data.system.arch,
            'Codename': data.system.codename
          });

          setRows('cpu-list', {
            'CPU': data.cpu.brand,
            'Vendor': data.cpu.manufacturer,
            'Cores': data.cpu.cores,
            'Physical cores': data.cpu.physicalCores,
            'Speed': data.cpu.speed ? `${data.cpu.speed} GHz` : 'N/A'
          });

          setRows('memory-list', {
            'Total': formatBytes(data.memory.total),
            'Used': formatBytes(data.memory.used),
            'Free': formatBytes(data.memory.free),
            'Available': formatBytes(data.memory.available),
            'Active': formatBytes(data.memory.active)
          });

          const diskText = data.disk.length
            ? data.disk.map((disk) => `${disk.name} (${formatBytes(disk.size)})`).join(', ')
            : 'N/A';

          setRows('disk-list', {
            'Drives': diskText
          });

          const networkText = data.network.length
            ? data.network.map((net) => `${net.iface}: ${net.ip4 || 'No IP'}`).join(', ')
            : 'N/A';

          setRows('network-list', {
            'Interfaces': networkText
          });

          setRows('battery-list', {
            'Battery': data.battery.hasBattery ? 'Có pin' : 'Không có pin',
            'Percent': data.battery.percent !== undefined ? `${data.battery.percent}%` : 'N/A',
            'Charging': data.battery.isCharging ? 'Đang sạc' : 'Không sạc',
            'Time remaining': data.battery.timeRemaining !== undefined && data.battery.timeRemaining !== null ? `${data.battery.timeRemaining} phút` : 'N/A'
          });

          document.getElementById('status').textContent = 'Đang hoạt động';
        } catch (error) {
          document.getElementById('status').textContent = 'Lỗi khi đọc dữ liệu';
          console.error(error);
        }
      }

      loadInfo();
      setInterval(loadInfo, 10000);
    </script>
  </body>
</html>
