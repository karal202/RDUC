name: Build and Publish Windows Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: appdesktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: appdesktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build and publish release
        run: npm run build:win:publish
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}